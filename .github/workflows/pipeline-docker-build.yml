name: Build and optionally Publish Docker Images

on:
  workflow_call:
    inputs:
      docker-name:
        description: 'Name of folder in the "docker" directory in this repository'
        required: true
        type: string
      dockerfile:
        description: 'Name of the docker file to use'
        required: true
        type: string
      tag-prefix:
        type: string
        default: ''
      platform:
        description: 'Docker build platform'
        type: string        
        default: linux/amd64
      publish:
        description: 'Whether to publish the image as well'
        required: true
        type: boolean
      runs-on:
        description: 'Host OS'
        default: ubuntu-latest
        type: string

concurrency:
  group: build-docker-${{ inputs.docker-name }}-${{ inputs.tag-prefix }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build-image:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Set up QEMU
        # Register QEMU static binaries via binfmt_misc so this amd64 runner can
        # build the arm64/arm images through emulation. This is the same command
        # docker/setup-qemu-action runs under the hood, inlined to avoid a
        # third-party action dependency. Pinned by digest; bump manually since
        # Dependabot does not track images referenced in run steps.
        run: docker run --rm --privileged docker.io/tonistiigi/binfmt:qemu-v10.2.1@sha256:d3b963f787999e6c0219a48dba02978769286ff61a5f4d26245cb6a6e5567ea3 --install all
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Keep this in sync with NODE_MAJOR in tools/install-deps.sh so the
          # cached headers match the Node version installed in the images.
          node-version: '22'
          package-manager-cache: false
      - name: Pre-populate node-gyp header cache
        # Headers are platform/arch-independent (only Windows pulls an
        # arch-specific node.lib), so it is safe to generate them on the amd64
        # runner and COPY the result into every image.
        run: |
          corepack enable
          yarn install --immutable
          yarn node-gyp install --devdir "$PWD/.node-gyp-headers"
          ls -la .node-gyp-headers
      - name: Log in to ghcr.io
        if: inputs.publish
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - name: Build Docker image
        # Inlined replacement for mr-smithers-excellent/docker-build-push.
        # Image name follows the same scheme the action produced for ghcr.io:
        # ghcr.io/<owner>/<image>, tagged with "<prefix>latest" and "<prefix><sha>".
        env:
          REGISTRY_OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ inputs.docker-name }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          PLATFORM: ${{ inputs.platform }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          SHA: ${{ github.sha }}
        run: |
          owner=$(echo "$REGISTRY_OWNER" | tr '[:upper:]' '[:lower:]')
          image_name="ghcr.io/${owner}/${IMAGE}"
          docker build \
            -f "$DOCKERFILE" \
            -t "${image_name}:${TAG_PREFIX}latest" \
            -t "${image_name}:${TAG_PREFIX}${SHA}" \
            --platform "$PLATFORM" \
            .
      - name: Push Docker image
        if: inputs.publish
        env:
          REGISTRY_OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ inputs.docker-name }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          SHA: ${{ github.sha }}
        run: |
          owner=$(echo "$REGISTRY_OWNER" | tr '[:upper:]' '[:lower:]')
          image_name="ghcr.io/${owner}/${IMAGE}"
          docker push "${image_name}:${TAG_PREFIX}latest"
          docker push "${image_name}:${TAG_PREFIX}${SHA}"
